# SPDX-License-Identifier: MIT
#
# Every job here runs for merge requests and for tags. A push to the default
# branch does not start a pipeline: what lands there has already been through
# one as a merge request. To run one on any branch anyway, start it by hand
# from Build > Pipelines > "New pipeline", or through the API or a trigger
# token. To make a green pipeline a condition for merging, also enable
#   Settings > Merge requests > Merge checks > "Pipelines must succeed"
# and protect the default branch; that part cannot be set from this file.

# GitLab's own scanners. They add jobs to the "test" stage and report in
# the merge request and under Secure > Vulnerability report:
#   secret_detection   credentials committed to the repository
#   semgrep-sast       static analysis of the C sources
# There is nothing for dependency or container scanning to look at: the
# project has no third-party dependencies and builds no images.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  # Run the scanners in merge request pipelines as well as on branches.
  AST_ENABLE_MR_PIPELINES: "true"

stages:
  - test
  - package

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    # Started by hand, on whatever branch was chosen.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"

default:
  image: fedora:44
  interruptible: true

.fedora-llvm:
  before_script:
    - dnf -y -q install clang llvm compiler-rt make tar gzip procps-ng
        findutils diffutils groff-base ShellCheck

# The default build treats warnings as errors.
test:
  extends: .fedora-llvm
  stage: test
  script:
    - make test

lint:
  extends: .fedora-llvm
  stage: test
  script:
    - make lint

# The same checks as the pre-commit hook: LLVM formatting, clang-tidy with
# every finding an error, and a warnings-as-errors build.
precommit:
  stage: test
  before_script:
    - dnf -y -q install clang clang-tools-extra make
  script:
    - ./precommit.sh

# AddressSanitizer: memory errors, and leaks (leak detection is on by
# default on Linux).
asan:
  extends: .fedora-llvm
  stage: test
  script:
    - make check-asan
  artifacts:
    when: on_failure
    paths: [build/asan/reports/]

# UndefinedBehaviorSanitizer, with every finding fatal.
ubsan:
  extends: .fedora-llvm
  stage: test
  script:
    - make check-ubsan
  artifacts:
    when: on_failure
    paths: [build/ubsan/reports/]

# ThreadSanitizer is the user-space counterpart of lockdep (lock-order
# inversions, data races). babysit has no threads or mutexes, so this is a
# guard against regressions rather than a source of findings today; the
# locks babysit does use are fcntl() file locks, which the test suite
# exercises directly (see "log locks" in tests/run.sh).
tsan:
  extends: .fedora-llvm
  stage: test
  script:
    - make check-tsan
  artifacts:
    when: on_failure
    paths: [build/tsan/reports/]

coverage:
  extends: .fedora-llvm
  stage: test
  script:
    - make coverage COVERAGE_MIN=85
  coverage: '/^Line coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - build/coverage/html/
      - build/coverage/report.txt
      - build/coverage/lcov.info

# A second libc and userland (Debian's), to keep the code portable.
test-debian:
  stage: test
  image: debian:trixie
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq clang make procps tar gzip
  script:
    - make CFLAGS="-O2 -g -Wall -Wextra -pedantic -Werror" test

# ---- other architectures and systems ----------------------------------------
#
# aarch64 Linux uses GitLab's hosted arm64 runners.

test-arm64:
  extends: .fedora-llvm
  stage: test
  tags: [saas-linux-small-arm64]
  script:
    - make CFLAGS="-O2 -g -Wall -Wextra -pedantic -Werror" test

# GitLab has no hosted FreeBSD runners. Until there is one of your own,
# FreeBSD is tested by hand with "make check-freebsd-vm". To test it here,
# register a FreeBSD machine as a runner with the tag "freebsd" (one per
# architecture you want covered) and set the CI/CD variable ENABLE_FREEBSD=1.
test-freebsd:
  stage: test
  tags: [freebsd]
  rules:
    - if: $ENABLE_FREEBSD == "1"
  script:
    - gmake CFLAGS="-O2 -g -Wall -Wextra -pedantic -Werror" test
    - gmake check-asan check-ubsan check-tsan
    - gmake freebsd-pkg
  artifacts:
    paths: [build/*.pkg]

# macOS is best effort. Hosted macOS runners need a paid plan; set
# ENABLE_MACOS=1 to turn this job on. It never blocks a merge.
test-macos:
  stage: test
  image: macos-15-xcode-16
  tags: [saas-macos-medium-m1]
  allow_failure: true
  rules:
    - if: $ENABLE_MACOS == "1"
  script:
    - brew install make bash
    - gmake CC=clang test

tarball:
  extends: .fedora-llvm
  stage: package
  script:
    - make dist bindist
  artifacts:
    paths: [build/*.tar.gz]

rpm:
  stage: package
  before_script:
    - dnf -y -q install clang make tar gzip procps-ng findutils rpm-build
        systemd-rpm-macros
  script:
    - make rpm
  artifacts:
    paths: [build/rpm/RPMS/]

rpm-arm64:
  extends: rpm
  tags: [saas-linux-small-arm64]

# The same spec on openSUSE.
rpm-suse:
  stage: package
  image: opensuse/tumbleweed
  before_script:
    - zypper -n -q install clang make tar gzip procps findutils rpm-build
        systemd-rpm-macros
  script:
    - make rpm
  artifacts:
    paths: [build/rpm/RPMS/]

# Arch Linux. makepkg refuses to run as root, so the build is handed to an
# unprivileged user.
arch:
  stage: package
  image: archlinux:latest
  before_script:
    - pacman -Syu --noconfirm --needed base-devel clang procps-ng
    - useradd -m builder
    - chown -R builder .
  script:
    - su builder -c "make arch-pkg"
  artifacts:
    paths: [build/arch/*.pkg.tar.zst]

deb:
  stage: package
  image: debian:trixie
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq clang make procps tar gzip dpkg-dev debhelper
  script:
    - make deb
  artifacts:
    paths: [build/deb/*.deb]

deb-arm64:
  extends: deb
  tags: [saas-linux-small-arm64]
