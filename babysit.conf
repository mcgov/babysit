# babysit.conf - settings for babysitd(8). See babysit.conf(5).
# Copy to ~/.config/babysit/babysit.conf; the values below are the defaults.

# Delete archives (babysit_logs_*.tar.gz) and finished logs older than this
# many days.
# 0 keeps them forever.
max_age_days = 30

# When the filesystem holding the logs is this full (percent) or more, start
# a new log generation so the logs written so far can be packed and
# compressed. 0 disables.
compact_at_disk_percent = 90

# Last resort: when that filesystem is this full (percent) or more, delete
# packed logs (archives of earlier boots and packed generations), oldest
# first, until it is not. Live logs are never deleted. 0 disables.
# If the disk is full of other things this deletes every packed log for no
# gain, so it is off unless you turn it on.
delete_at_disk_percent = 0

# How often to wake up and do the housekeeping when nothing asks for it
# sooner: a number with an s, m, h or d suffix. babysit wakes the service
# itself when it starts a new log generation, so this can stay long.
check_interval = 6h
