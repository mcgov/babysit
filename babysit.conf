# babysit.conf - settings for babysitd(8). See babysit.conf(5).
# Copy to ~/.config/babysit/babysit.conf; the values below are the defaults.

# The clock used to date instance identifiers and log directories: local or
# utc. Read by babysit as well as babysitd.
# Change to UTC if using with automation
timezone = local

# Finished logs stay where they are, readable under their identifiers, until
# their day is this many days old; then they are packed into the archive
# (archive/babysit_logs_<YYYYmmdd>.tar.gz). 1 archives every day before
# today. 0 never archives by age. Logs of commands that are still running
# are never archived, however old.
archive_after_days = 1

# When the filesystem holding the logs is this full (percent) or more, do
# not wait for archive_after_days: archive every day before today, and pack
# the finished hours of today as well. 0 disables.
archive_on_usage_percentage = 90

# Delete archives (babysit_logs_*.tar.gz) and finished logs older than this
# many days.
# 0 keeps them forever.
max_age_days = 30

# Last resort: when that filesystem is this full (percent) or more, delete
# packed logs (archives of past days and packed hours), oldest
# first, until it is not. Live logs are never deleted. 0 disables.
# If the disk is full of other things this deletes every packed log for no
# gain, so it is off unless you turn it on.
delete_at_disk_percent = 0

# How often to wake up and do the housekeeping when nothing asks for it
# sooner: a number with an s, m, h or d suffix. babysit wakes the service
# itself when it needs something packed, so this can stay long.
check_interval = 6h
